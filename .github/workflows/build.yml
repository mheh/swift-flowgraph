name: build

# One build of flowgraph for each platform. The image and the release both take the files of these builds, and compile nothing.
#   flowgraph-x86_64-linux.zip   built in the Swift image, so it needs the Swift toolchain of that version
#   flowgraph-arm64-macos.zip    built with the Xcode of the runner
# Each zip holds the binary and its resources folder, which must stay beside it.
# The zip names carry no version, so the rolling `latest` release keeps the same download links.

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  SWIFT_VERSION: '6.4'
  SWIFT_IMAGE: swift:6.4-noble
  IMAGE: mhehmsoth/swift-flowgraph

jobs:
  build:
    name: flowgraph ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write # The job deletes the older entries of its cache.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-24.04
          - platform: arm64-macos
            runner: macos-latest
    env:
      CACHE_FAMILY: spm-${{ matrix.platform }}-swift-6.4-
      ZIP_NAME: flowgraph-${{ matrix.platform }}.zip
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ env.CACHE_FAMILY }}${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_FAMILY }}

      - name: Build in the Swift image
        if: ${{ runner.os == 'Linux' }}
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace "$SWIFT_IMAGE" Scripts/build.sh dist
          sudo chown -R "$(id -u):$(id -g)" .build dist

      - name: Build with Xcode
        if: ${{ runner.os == 'macOS' }}
        run: |
          swift --version
          Scripts/build.sh dist

      # The Linux build is tested in the image job, with the toolchain that it needs.
      - name: Test on the fixture package
        if: ${{ runner.os == 'macOS' }}
        run: |
          swift build --package-path Tests/fixture
          dist/flowgraph list entries Tests/fixture --sources Sources/App | tee entries.txt
          [ "$(grep -c . entries.txt)" = 4 ]
          dist/flowgraph snapshot Tests/fixture --sources Sources/App --out snapshot.json --html page.html
          grep -q '"bodies":{"' snapshot.json
          [ -s page.html ]

      - name: Save the build cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ env.CACHE_FAMILY }}${{ github.run_id }}

      - name: Delete the older entries of the cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ env.CACHE_FAMILY }}${{ github.run_id }}
        run: |
          gh cache list --key "$CACHE_FAMILY" --limit 100 --json id,key \
            --jq '.[] | select(.key != env.KEEP) | .id' | while read -r id; do gh cache delete "$id"; done

      - name: Package the zip
        run: cd dist && zip -qry "../$ZIP_NAME" . && ls -l "../$ZIP_NAME"

      - name: Upload the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

  image:
    name: Docker image
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flowgraph-x86_64-linux.zip

      - name: Package the image
        run: |
          unzip -q flowgraph-x86_64-linux.zip -d dist
          docker build -f Dockerfile.ci --build-arg "SWIFT_IMAGE=$SWIFT_IMAGE" -t flowgraph:test dist

      - name: Test on the fixture package
        run: Tests/fixture/check.sh flowgraph:test

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        run: |
          docker tag flowgraph:test "$IMAGE:swift-$SWIFT_VERSION"
          docker push "$IMAGE:swift-$SWIFT_VERSION"

  # The release waits for the image job, because that job is the test of the Linux build.
  release:
    name: Update the rolling release
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # The job attaches the zips to the rolling release.
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish the rolling latest release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: latest
          name: Rolling build (master)
          prerelease: true
          body: |
            Automated build of `master` at ${{ github.sha }}.
            Each zip holds `flowgraph` and its resources folder. Keep the two in one directory.
            The Linux build needs the Swift ${{ env.SWIFT_VERSION }} toolchain, and the macOS build needs Xcode.
          files: dist/*.zip
          fail_on_unmatched_files: true
