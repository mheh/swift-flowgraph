<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>flowgraph</title>
<style>
  :root { --bg:#15171c; --panel:#1c1f26; --line:#2e333d; --text:#d9dce3; --dim:#8a91a0; --accent:#4c82e8;
          --fn:#5aa9e6; --data:#e6b35a; --type:#8fd48f; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:13px/1.4 -apple-system, "Segoe UI", sans-serif; }
  body { display:grid; grid-template-rows:auto auto 1fr; grid-template-columns:1fr 360px; }
  header, nav { grid-column:1 / 3; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  nav { padding:5px 12px; }
  header h1 { font-size:14px; margin:0 6px 0 0; }
  .grp { display:inline-flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding-left:14px; border-left:1px solid var(--line); }
  .grp.end { margin-left:auto; }
  body.empty header > :not(h1):not(.end), body.empty nav > *, body.empty #side > *, body.empty #diffbutton { visibility:hidden; }
  label { color:var(--dim); display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
  input, select, button { font:inherit; color:var(--text); background:#262a33; border:1px solid #3d4350; border-radius:4px; padding:3px 7px; }
  input[type=checkbox] { padding:0; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  #tabs { display:inline-flex; gap:4px; }
  #tabs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  #viewbar { display:inline-flex; gap:10px; align-items:center; }
  #search { width:260px; }
  #searchbox { position:relative; }
  #hits { position:absolute; top:100%; left:0; width:520px; max-height:60vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:4px; z-index:10; display:none; }
  .row { padding:4px 8px; cursor:pointer; display:flex; gap:8px; align-items:baseline; white-space:nowrap; overflow:hidden; }
  .row:hover, .row.on { background:#2a3040; }
  .row .where { color:var(--dim); font-size:11px; overflow:hidden; text-overflow:ellipsis; }
  .dot { width:8px; height:8px; border-radius:2px; flex:none; align-self:center; }
  .fn { background:var(--fn); } .data { background:var(--data); } .type { background:var(--type); }
  #views { min-height:0; min-width:0; position:relative; }
  .viewbox { position:absolute; inset:0; display:none; }
  .viewbox.on { display:block; }
  #library { position:absolute; inset:0; display:none; z-index:5; background:var(--bg); overflow:auto; padding:28px 32px; }
  #library.on { display:block; }
  #library.over { outline:2px dashed var(--accent); outline-offset:-10px; }
  #library h2 { font-size:16px; margin:0 0 4px; display:flex; gap:12px; align-items:center; }
  #library code { background:#12141a; padding:2px 6px; border-radius:4px; font:12px ui-monospace, Menlo, monospace; }
  #library .lrow { display:grid; grid-template-columns:minmax(200px, 2fr) minmax(140px, 1.2fr) 130px 80px 80px 70px minmax(190px, auto); column-gap:14px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); }
  #library .lrow.lhead { color:var(--dim); text-transform:uppercase; font-size:10px; letter-spacing:.04em; }
  #library .lrow > span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #library .n { text-align:right; font-variant-numeric:tabular-nums; }
  #library .lrow > .lact { display:inline-flex; gap:6px; justify-content:flex-end; overflow:visible; }
  #library .tag { font-style:normal; border:1px solid var(--accent); border-radius:8px; padding:0 6px; font-size:10px; margin-left:6px; }
  #library .add { margin:18px 0; padding:22px; border:1px dashed #3d4350; border-radius:6px; text-align:center; }
  #library .err { color:#e6705a; margin:8px 0; } #library .note { color:var(--accent); margin:8px 0; }
  #library details { margin-top:14px; color:var(--dim); } #library details p { margin:6px 0 6px 14px; }
  button:disabled { opacity:.4; cursor:default; border-color:#3d4350; }
  .ghint { position:absolute; inset:0; display:none; flex-direction:column; gap:12px; align-items:center; justify-content:center; text-align:center; z-index:4; padding:40px; font-size:14px; }
  .ghint.on { display:flex; }
  .ghint .entries { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-width:860px; }
  kbd, .ghint code { border:1px solid #3d4350; border-radius:3px; padding:0 5px; background:#262a33; font:12px ui-monospace, Menlo, monospace; }
  #side { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:10px 12px; min-height:0; }
  #side h2 { font-size:14px; margin:0 0 2px; word-break:break-all; }
  #side h3 { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:14px 0 4px; }
  #side pre { white-space:pre-wrap; word-break:break-word; background:#12141a; padding:6px 8px; border-radius:4px; margin:6px 0; font:12px ui-monospace, Menlo, monospace; }
  #side .row { padding:2px 4px; border-radius:3px; }
  .dim { color:var(--dim); } .actions { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  #status { margin-left:auto; color:var(--dim); } #status.warn { color:#e6b35a; }
  .chip { display:inline-flex; gap:4px; align-items:center; background:#262a33; border:1px solid var(--accent); border-radius:10px; padding:1px 8px; margin:2px 4px 2px 0; }
  .chip b { cursor:pointer; color:var(--dim); }
  .chip.off { border-color:#555; color:var(--dim); }
  .dst { border-radius:3px; padding:0 5px; font-size:11px; white-space:nowrap; }
  .d-added { background:#16301f; color:#7fd88f; } .d-removed { background:#3a1c1c; color:#f08a7a; } .d-signature { background:#3a2c14; color:#f0b860; }
  .d-body { background:#33301a; color:#e0d070; } .d-affected { background:#23272f; color:#9aa3b5; } .d-mark { background:#33183a; color:#f0a0e6; }
  #diffinfo { display:inline-flex; align-items:center; gap:8px; }
  .chip.mark { border-color:#e05ad0; color:#f0a0e6; }
  #marks { display:inline-flex; flex-wrap:wrap; align-items:center; gap:2px; }
  .row.absent > span:not(.dot):not(.where) { color:var(--dim); }
  .sw { flex:none; width:14px; text-align:center; color:var(--dim); border:1px solid #3d4350; border-radius:3px; line-height:13px; font-weight:normal; }
  .sw:hover { color:#fff; border-color:var(--accent); }
  h3 button { font-size:10px; padding:0 6px; margin-left:6px; }
</style>
<header>
  <h1 id="title">flowgraph</h1>
  <span id="searchbox"><input id="search" placeholder="Find a symbol…  ( / )" autocomplete="off"><div id="hits"></div></span>
  <span class="grp" title="Where the views start, and how far they go from there">
  <label id="productbox">product <select id="product"></select></label>
  <label id="entrybox">entry <select id="entry"></select></label>
  <label>callers <select id="up"></select></label>
  <label>callees <select id="down"></select></label>
  </span>
  <span class="grp" title="What the views hold">
  <label>group <select id="group"><option value="file">by file</option><option value="branch">by entry branch</option><option value="type">by type</option><option value="module">by module</option><option value="product">by product</option><option value="package">by package</option><option value="none">none</option></select></label>
  <span id="kinds"></span>
  <label><input type="checkbox" id="data" checked> data</label>
  <label><input type="checkbox" id="types" checked> types</label>
  <label id="extbox" title="The symbols of the packages that the project depends on"><input type="checkbox" id="ext" checked> dependencies</label>
  <label id="sysbox" title="The symbols of the standard library and of the SDK"><input type="checkbox" id="sys"> system</label>
  </span>
  <span class="grp end">
  <button id="librarybutton" title="The snapshots that this browser keeps: open one, add one, or delete one">Library</button>
  <button id="diffbutton" title="Compare this snapshot with another one, for example of the main branch">Diff…</button>
  </span>
  <input id="addfile" type="file" accept=".json,application/json" multiple hidden>
  <input id="addindex" type="file" webkitdirectory hidden>
</header>
<nav>
  <span id="tabs"></span>
  <span id="viewbar"></span>
  <span id="marks"></span>
  <span id="diffinfo"></span>
  <span id="source" class="dim"></span>
  <span id="status"></span>
</nav>
<div id="views">
  <div id="library"></div>
</div>
<aside id="side"></aside>
<!-- The single-file form of the page has each of these scripts inside it. A new view is one more view-*.js line. -->
<script src="vendor/cytoscape.min.js"></script>
<script src="vendor/elk.bundled.js"></script>
<script src="vendor/cytoscape-elk.js"></script>
<script src="across.js"></script>
<script src="diff.js"></script>
<script src="model.js"></script>
<script src="core.js"></script>
<script src="toolbar.js"></script>
<script src="panel.js"></script>
<script src="store.js"></script>
<script src="exporter.js"></script>
<script src="library.js"></script>
<script src="view-graph.js"></script>
<script src="view-table.js"></script>
<script src="view-trace.js"></script>
<script src="view-changes.js"></script>
<script>FG.start(/*__SNAPSHOT__*/null);</script>
</html>
